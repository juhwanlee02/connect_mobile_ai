<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  {{FONT_FACE}}
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: linear-gradient(120deg, {{BG1}} 0%, {{BG2}} 100%);
    font-family: {{FONT_FAMILY}}, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    overflow: hidden;
  }
  .wrap { width: 86%; }
  .headline { color: {{INK}}; font-weight: 800; font-size: 16vh; line-height: 1.1; letter-spacing: -0.01em; }
  .sub { color: {{SUB}}; font-weight: 500; font-size: 7vh; margin-top: 4vh; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="headline">{{HEADLINE}}</div>
    <div class="sub">{{SUBTEXT}}</div>
  </div>
</body>
</html>
