# pubspec.deps.yaml
#
# 이 파일은 스타터 오버레이가 요구하는 의존성 "카탈로그"다. 그 자체로는
# pubspec.yaml이 아니며, apply.sh가 dependencies(및 이후 태스크에서 assets)
# 섹션만 읽어서 target 프로젝트의 pubspec.yaml에 병합한다.
#
# 병합 규칙(apply.sh 참조):
#   - 이 파일의 `dependencies:` 아래 각 최상위 항목(`  key: value` 형태의 줄)을
#     순서대로 확인한다.
#   - target pubspec.yaml의 `dependencies:` 블록에 동일한 `key:`가 이미
#     있으면 건너뛴다(중복 키 무시 — 기존 값을 존중).
#   - 없으면 target의 `dependencies:` 섹션 끝(다음 최상위 키 직전, 또는
#     파일 끝)에 그 줄을 그대로 append한다.
#   - 이것은 진짜 YAML 병합이 아니라 텍스트 라인 append다. 버전 범위 충돌
#     해소나 nested map 병합은 하지 않는다 — 스타터 단계에서는 항목 수가
#     적고 안정적이므로 단순함을 우선한다.
#
# flutter.assets 섹션 (Task 2 추가):
#   - 이 파일의 최상위 `flutter:` 아래 `  assets:` 리스트 항목(`    - path`
#     형태, 4-space 들여쓰기)을 target pubspec.yaml의 `flutter:` 섹션에
#     병합한다.
#   - target에 `flutter:` 섹션 안에 이미 `assets:` 키가 있으면 그 리스트에
#     없는 항목만 append한다. `assets:` 키 자체가 없으면(flutter create
#     기본 pubspec은 assets가 전부 주석 처리돼 있어 이 경우에 해당) `flutter:`
#     줄 바로 다음에 `  assets:`와 항목들을 새로 삽입한다.
#   - dependencies와 마찬가지로 진짜 YAML 파서가 아니라 텍스트 라인 처리다.

dependencies:
  go_router: ^14.6.2
  shared_preferences: ^2.3.3

flutter:
  assets:
    - assets/lang/
